<!DOCTYPE html>
<html lang="es">
<head>

<link rel="manifest" href="manifest.json">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Puntualízate</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#fdf1f7,#eef9ff,#f4efff);
    color:#3d405b;
}

/* CONTENEDOR PRINCIPAL */

.app{
    width:100%;
    max-width:560px;
    margin:auto;
    min-height:100vh;
    background:#fffaff;
    box-shadow:0 0 35px #b8a9c955;
}

/* ENCABEZADO */

header{
    background:
        linear-gradient(#8f6b9b66,#8f6b9b66),
        url("lan-zhan.png");
    background-size:cover;
    background-position:center 35%;
    background-repeat:no-repeat;
    color:white;
    padding:45px 20px;
    text-align:center;
    position:relative;
    border-radius:0 0 30px 30px;
    box-shadow:0 5px 20px #9d8ab044;
}
header h1{
    margin:0;
    font-size:32px;
    letter-spacing:.5px;
}

header p{
    margin:8px 0 0;
    font-size:14px;
    opacity:.95;
}

/* CONTENIDO */

.contenido{
    padding:22px;
}

/* TARJETAS */

.card{
    background:#ffffff;
    border-radius:24px;
    padding:21px;
    margin-bottom:20px;
    box-shadow:0 8px 25px #b8a9c933;
    border:1px solid #f0e5f2;
}

h2{
    margin-top:0;
    color:#76527a;
    font-size:20px;
}

/* TEXTOS */

label{
    display:block;
    margin-top:15px;
    margin-bottom:6px;
    font-weight:bold;
    font-size:14px;
    color:#68556b;
}

/* CAMPOS */

input,
select{
    width:100%;
    padding:13px 14px;
    margin-top:3px;
    border:2px solid #eee4f1;
    border-radius:14px;
    font-size:15px;
    background:#fffaff;
    color:#4d4650;
    outline:none;
    transition:.2s;
}

input:focus,
select:focus{
    border-color:#c798ca;
    box-shadow:0 0 0 4px #dcb9df33;
}

/* BOTONES */

button{
    border:none;
    border-radius:14px;
    padding:11px 15px;
    cursor:pointer;
    font-size:14px;
    margin-top:12px;
    transition:.2s;
}

button:hover{
    transform:translateY(-2px);
    box-shadow:0 5px 12px #00000018;
}

.agregar{
    width:100%;
    background:linear-gradient(135deg,#c58bc7,#78c5d1);
    color:white;
    font-weight:bold;
    font-size:16px;
    padding:14px;
    margin-top:20px;
}

/* TARJETAS DE ACTIVIDADES */

.tarea{
    background:linear-gradient(135deg,#ffffff,#fff8fd);
    border-left:6px solid #c58bc7;
    border-radius:18px;
    padding:17px;
    margin-top:14px;
    box-shadow:0 5px 18px #b8a9c933;
}

.tarea h3{
    margin:0 0 8px;
    color:#77517d;
    font-size:17px;
}

.tarea p{
    margin:7px 0;
    color:#5f5963;
    font-size:14px;
}

.estado{
    font-weight:bold;
    color:#8a63a0 !important;
    background:#f5eafa;
    padding:9px 11px;
    border-radius:11px;
}

/* BOTONES DE LAS TAREAS */

.acciones{
    display:flex;
    gap:7px;
    flex-wrap:wrap;
}

.acciones button{
    margin-right:0;
}

.hecha{
    background:#8bc9ad;
    color:white;
}

.recordar{
    background:#e8b76d;
    color:white;
}

.eliminar{
    background:#df8b9a;
    color:white;
}

/* MENSAJE DE ACTIVIDADES VACÍAS */

.pequeno{
    font-size:13px;
    color:#9a8d9e;
    text-align:center;
    padding:15px;
}

/* ALERTA */

.alerta{
    position:fixed;
    bottom:22px;
    left:50%;
    transform:translateX(-50%);
    width:90%;
    max-width:450px;
    background:linear-gradient(135deg,#76527a,#9b6fa0);
    color:white;
    padding:20px;
    border-radius:22px;
    box-shadow:0 10px 35px #00000040;
    display:none;
    z-index:10;
}

.alerta button{
    background:white;
    color:#76527a;
    margin-right:6px;
}

</style>
</head>

<body>

<div class="app">

<header>
    <h1> Puntualízate</h1>
    <p>Organiza tus tareas y evita las tardanzas</p>
</header>

<div class="contenido">

<div class="card">

<h2>➕ Nueva actividad</h2>

<label>Materia</label>
<select id="materia">
    <option>Matemática</option>
    <option>Comunicación</option>
    <option>Ciencia y Tecnología</option>
    <option>EPT</option>
    <option>Inglés</option>
    <option>Historia</option>
    <option>Religión</option>
    <option>Otra</option>
</select>

<label>Nombre de la actividad</label>
<input id="actividad" type="text" placeholder="Ej.: Resolver ejercicios de probabilidad">

<label>Fecha y hora</label>
<input id="fecha" type="datetime-local">

<label>Avisarme</label>
<select id="minutos">
    <option value="1">1 minuto antes</option>
    <option value="5" selected>5 minutos antes</option>
    <option value="10">10 minutos antes</option>
    <option value="15">15 minutos antes</option>
    <option value="30">30 minutos antes</option>
</select>

<label>🔔 Sonido</label>
<select id="sonido">
    <option value="campana">🔔 Campanita</option>
    <option value="melodia">🎵 Melodía</option>
    <option value="alarma">🚨 Alarma</option>
    <option value="digital">💻 Digital</option>
    <option value="ninguno">🔇 Sin sonido</option>
    <option value="personalizado">🎵Mi propio sonido</option>
</select>
<input type="file" id="archivoSonido" accept="audio/*" style="display:none;">

<label>
    🔊 Aviso por voz
</label>

<select id="voz">
    <option value="si">Activado</option>
    <option value="no">Desactivado</option>
</select>

<button class="agregar" onclick="agregarTarea()">
    ＋ Agregar actividad
</button>

</div>

<div class="card">

<h2>📅 Mis actividades</h2>

<div id="lista"></div>

</div>

</div>
</div>

<div class="alerta" id="alerta">

<strong id="mensajeAlerta"></strong>

<br>

<button onclick="cerrarAlerta()">
Ya la hice ✅
</button>

<button onclick="recordarDespues()">
Recordarme después ⏳
</button>

</div>

<script>

let tareas = JSON.parse(localStorage.getItem("tareasPuntualizate")) || [];

let tareaActual = null;

function guardar(){
    localStorage.setItem(
        "tareasPuntualizate",
        JSON.stringify(tareas)
    );
}
function convertirAudioBase64(archivo){

    return new Promise((resolve, reject) => {

        const lector = new FileReader();

        lector.onload = () => {
            resolve(lector.result);
        };

        lector.onerror = () => {
            reject(lector.error);
        };

        lector.readAsDataURL(archivo);

    });

}


async function agregarTarea(){

    const materia =
        document.getElementById("materia").value;

    const actividad =
        document.getElementById("actividad").value.trim();

    const fecha =
        document.getElementById("fecha").value;

    const minutos =
        Number(document.getElementById("minutos").value);

    const sonido =
        document.getElementById("sonido").value;

    const archivoSonido =
        document.getElementById("archivoSonido").files[0];

    let sonidoPersonalizado = "";

    if(sonido === "personalizado"){

        if(!archivoSonido){

            alert("Selecciona un archivo de sonido.");
            return;

        }

        sonidoPersonalizado =
            await convertirAudioBase64(archivoSonido);

    }

    const voz =
        document.getElementById("voz").value;

    if(!actividad || !fecha){

        alert("Completa el nombre de la actividad y la fecha.");
        return;

    }

    const tarea = {

        id:Date.now(),

        materia:materia,

        actividad:actividad,

        fecha:fecha,

        minutos:minutos,

        sonido:sonido,

        sonidoPersonalizado:sonidoPersonalizado,

        voz:voz,

        avisada:false,

        completada:false

    };

    tareas.push(tarea);

    guardar();

    document.getElementById("actividad").value="";

    document.getElementById("archivoSonido").value="";

    mostrarTareas();

}
function mostrarTareas(){

    const lista =
        document.getElementById("lista");

    lista.innerHTML="";

    if(tareas.length===0){

        lista.innerHTML=
        '<p class="pequeno">Todavía no tienes actividades.</p>';

        return;
    }

    tareas
    .filter(t => !t.completada)
    .sort((a,b)=>
        new Date(a.fecha)-new Date(b.fecha)
    )
    .forEach(t => {

        const fecha =
            new Date(t.fecha);

        const div =
            document.createElement("div");

        div.className="tarea";

        div.innerHTML=`

            <h3>📚 ${t.materia}</h3>

            <p><strong>${t.actividad}</strong></p>

            <p>
            📅 ${fecha.toLocaleDateString()}
            <br>
            ⏰ ${fecha.toLocaleTimeString([],{
                hour:'2-digit',
                minute:'2-digit'
            })}
            </p>

            <p>
            🔔 Aviso ${t.minutos} min antes
            </p>

            <p class="estado">
            ⏳ ${tiempoRestante(t)}
            </p>

            <div class="acciones">

                <button class="hecha"
                onclick="completar(${t.id})">
                ✅ Ya la hice
                </button>

                <button class="recordar"
                onclick="editarTarea(${t.id})">
                ✏️ Cambiar
                </button>

                <button class="eliminar"
                onclick="eliminarTarea(${t.id})">
                🗑️
                </button>

            </div>
        `;

        lista.appendChild(div);

    });

}

function tiempoRestante(t){

    const ahora =
        new Date();

    const fecha =
        new Date(t.fecha);

    const diferencia =
        fecha-ahora;

    if(diferencia<=0)
        return "⚠️ Actividad pendiente";

    const minutos =
        Math.floor(diferencia/60000);

    if(minutos<60)
        return `Faltan ${minutos} minutos`;

    const horas =
        Math.floor(minutos/60);

    const min =
        minutos%60;

    return `Faltan ${horas} h ${min} min`;

}

function completar(id){

    const tarea =
        tareas.find(t=>t.id===id);

    if(tarea){

        tarea.completada=true;

        guardar();

        mostrarTareas();
    }

}

function eliminarTarea(id){

    if(confirm("¿Eliminar esta actividad?")){

        tareas =
            tareas.filter(t=>t.id!==id);

        guardar();

        mostrarTareas();
    }

}

function editarTarea(id){

    const tarea =
        tareas.find(t=>t.id===id);

    if(!tarea)return;

    const nuevoNombre =
        prompt(
            "Cambiar nombre de la actividad:",
            tarea.actividad
        );

    if(nuevoNombre){

        tarea.actividad =
            nuevoNombre;

        guardar();

        mostrarTareas();
    }

}

function sonidoCampana(){

    const ctx =
        new AudioContext();

    const osc =
        ctx.createOscillator();

    const gain =
        ctx.createGain();

    osc.connect(gain);

    gain.connect(ctx.destination);

    osc.frequency.value=900;

    gain.gain.setValueAtTime(
        0.3,
        ctx.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        0.001,
        ctx.currentTime+1
    );

    osc.start();

    osc.stop(
        ctx.currentTime+1
    );

}

function sonidoDigital(){

    const ctx =
        new AudioContext();

    [700,1000,700].forEach(
        (frecuencia,i)=>{

            const osc =
                ctx.createOscillator();

            const gain =
                ctx.createGain();

            osc.connect(gain);

            gain.connect(ctx.destination);

            osc.frequency.value=
                frecuencia;

            const inicio =
                ctx.currentTime+i*0.25;

            gain.gain.setValueAtTime(
                0.2,
                inicio
            );

            gain.gain.exponentialRampToValueAtTime(
                0.001,
                inicio+0.2
            );

            osc.start(inicio);

            osc.stop(inicio+0.2);

        }
    );

}

function sonidoAlarma(){

    const ctx =
        new AudioContext();

    let i=0;

    const intervalo =
        setInterval(()=>{

            const osc =
                ctx.createOscillator();

            const gain =
                ctx.createGain();

            osc.connect(gain);

            gain.connect(ctx.destination);

            osc.frequency.value =
                i%2===0 ? 900 : 600;

            gain.gain.value=0.2;

            osc.start();

            osc.stop(
                ctx.currentTime+0.18
            );

            i++;

            if(i>=6){

                clearInterval(intervalo);

            }

        },250);

}

function sonidoMelodia(){

    const ctx =
        new AudioContext();

    const notas=[
        523,659,784,659,880
    ];

    notas.forEach(
        (frecuencia,i)=>{

            const osc =
                ctx.createOscillator();

            const gain =
                ctx.createGain();

            osc.connect(gain);

            gain.connect(ctx.destination);

            osc.frequency.value=
                frecuencia;

            const inicio =
                ctx.currentTime+i*0.3;

            gain.gain.setValueAtTime(
                0.2,
                inicio
            );

            gain.gain.exponentialRampToValueAtTime(
                0.001,
                inicio+0.28
            );

            osc.start(inicio);

            osc.stop(inicio+0.28);

        }
    );

}

function reproducirSonidoPersonalizado(tarea){
    
    if(!tarea.sonidoPersonalizado)
        return;

    const audio =
        new Audio(tarea.sonidoPersonalizado);

    audio.play().catch(error => {
        console.log("No se pudo reproducir el sonido:", error);
    });

}
function reproducirSonido(tipo){
    if(tipo==="campana")
        sonidoCampana();

    if(tipo==="digital")
        sonidoDigital();

    if(tipo==="alarma")
        sonidoAlarma();

    if(tipo==="melodia")
        sonidoMelodia();

}

function hablar(tarea){

    if(tarea.voz!=="si")
        return;

    if(!("speechSynthesis" in window))
        return;

    const mensaje =
        `Atención. Te quedan ${tarea.minutos} minutos para completar tu actividad de ${tarea.materia}: ${tarea.actividad}.`;

    const voz =
        new SpeechSynthesisUtterance(mensaje);

    voz.lang="es-ES";

    voz.rate=0.9;

    speechSynthesis.speak(voz);

}

function mostrarAlerta(tarea){

    tareaActual=tarea;

    document.getElementById(
        "mensajeAlerta"
    ).textContent=
        `⏰ Te quedan ${tarea.minutos} minutos para: ${tarea.actividad}`;

    document.getElementById(
        "alerta"
    ).style.display="block";

    if(tarea.sonido === "personalizado"){

    reproducirSonidoPersonalizado(tarea);

}else{

    reproducirSonido(
        tarea.sonido
    );

}

    hablar(tarea);

}

function cerrarAlerta(){

    if(tareaActual){

        tareaActual.avisada=true;

        guardar();

    }

    document.getElementById(
        "alerta"
    ).style.display="none";

    tareaActual=null;

    mostrarTareas();

}

function recordarDespues(){

    if(!tareaActual)
        return;

    tareaActual.avisada=false;

    const nuevaFecha =
        new Date(
            Date.now()+5*60000
        );

    tareaActual.fecha =
        nuevaFecha.toISOString();

    guardar();

    document.getElementById(
        "alerta"
    ).style.display="none";

    tareaActual=null;

    mostrarTareas();

}

function revisarRecordatorios(){

    const ahora =
        new Date();

    tareas.forEach(t=>{

        if(t.completada || t.avisada)
            return;

        const fecha =
            new Date(t.fecha);

        const aviso =
            new Date(
                fecha.getTime()
                -
                t.minutos*60000
            );

        if(
            ahora>=aviso &&
            ahora<fecha
        ){

            t.avisada=true;

            mostrarAlerta(t);

            guardar();

        }

    });

    mostrarTareas();

}

mostrarTareas();

setInterval(
    revisarRecordatorios,
    10000
);
document.getElementById("sonido").addEventListener("change", function() {
    const archivo = document.getElementById("archivoSonido");

    if (this.value === "personalizado") {
        archivo.click();
    }
});
if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js");
}
</script>

</body>
</html>
